name: Build Sun Star daily data

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      as_of:
        description: "UTC date to build (YYYY-MM-DD); blank means yesterday"
        required: false
        type: string
  pull_request:
    paths:
      - "scripts/publish_main.py"
      - "scripts/verify_pages.py"
      - ".github/workflows/build-sun-daily.yml"
  push:
    branches:
      - main
      - codex/sun-star-builder-20260915
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build-sun-daily.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: star-main-publication
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Sun Star
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime data dependency
        run: python -m pip install -r requirements.txt
      - name: Check out pinned public estate sources
        uses: actions/checkout@v5
        with:
          repository: Ventusltd/globalgrid2050
          ref: 35f07f9c0ef6bbdaae3c9f27f5a361118f49624f
          path: globalgrid2050-source
      - name: Select complete UTC day
        id: day
        shell: bash
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          if [[ -n "$REQUESTED_AS_OF" ]]; then
            AS_OF="$REQUESTED_AS_OF"
          else
            AS_OF="$(date -u -d yesterday +%F)"
          fi
          [[ "$AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
      - name: Build six committed payloads
        if: github.ref != 'refs/heads/main' || github.event_name == 'push'
        run: >-
          python scripts/build_sun.py
          --globalgrid-root globalgrid2050-source
          --globalgrid-commit 35f07f9c0ef6bbdaae3c9f27f5a361118f49624f
          --output sun
          --as-of "${{ steps.day.outputs.as_of }}"
      - name: Validate payload contracts
        if: github.ref != 'refs/heads/main' || github.event_name == 'push'
        run: python scripts/validate_sun.py sun
      - name: Regenerate, validate and publish against fresh main
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: >-
          python scripts/publish_main.py sun
          --globalgrid-root globalgrid2050-source
          --globalgrid-commit 35f07f9c0ef6bbdaae3c9f27f5a361118f49624f
          --as-of "${{ steps.day.outputs.as_of }}"
          --result "$RUNNER_TEMP/sun-publication.json"
      - name: Request Pages build and verify served payload hashes
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_pages.py
          --publication "$RUNNER_TEMP/sun-publication.json"
          --result "$RUNNER_TEMP/sun-pages-proof.json"
      - name: Preserve publication and Pages proof
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: sun-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sun-publication.json
            ${{ runner.temp }}/sun-pages-proof.json
          if-no-files-found: warn
