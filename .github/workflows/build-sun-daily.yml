name: Build Sun Star daily data

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      as_of:
        description: "UTC date to build (YYYY-MM-DD); blank means yesterday"
        required: false
        type: string
  push:
    branches:
      - main
      - codex/sun-star-builder-20260915
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build-sun-daily.yml"

permissions:
  contents: write

concurrency:
  group: sun-star-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Sun Star
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime data dependency
        run: python -m pip install -r requirements.txt
      - name: Check out pinned public estate sources
        uses: actions/checkout@v5
        with:
          repository: Ventusltd/globalgrid2050
          ref: 35f07f9c0ef6bbdaae3c9f27f5a361118f49624f
          path: globalgrid2050-source
      - name: Select complete UTC day
        id: day
        shell: bash
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          if [[ -n "$REQUESTED_AS_OF" ]]; then
            AS_OF="$REQUESTED_AS_OF"
          else
            AS_OF="$(date -u -d yesterday +%F)"
          fi
          [[ "$AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
      - name: Build six committed payloads
        run: >-
          python scripts/build_sun.py
          --globalgrid-root globalgrid2050-source
          --globalgrid-commit 35f07f9c0ef6bbdaae3c9f27f5a361118f49624f
          --output sun
          --as-of "${{ steps.day.outputs.as_of }}"
      - name: Validate payload contracts
        run: python scripts/validate_sun.py sun
      - name: Commit changed daily data on main schedule or dispatch
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- sun/today.json sun/history.json sun/uk-solar.json sun/voices.json sun/press.json sun/provenance.json
          if git diff --cached --quiet; then
            echo "No Sun Star data change"
          else
            git commit -m "data: update Sun Star ${{ steps.day.outputs.as_of }}"
            git push
          fi
