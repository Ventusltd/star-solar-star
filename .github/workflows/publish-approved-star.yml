name: Publish approved Star proposal

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: star-main-publication
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.event.label.name == 'star-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read proposal body without shell interpolation
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/star-proposal.md"
      - name: Validate immutable ID and publish against fresh main
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          python scripts/publish_main.py star
          --body-file "$RUNNER_TEMP/star-proposal.md"
          --issue-number "$ISSUE_NUMBER"
          --result "$RUNNER_TEMP/star-publication.json"
      - name: Request Pages build and verify served record hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/verify_pages.py
          --publication "$RUNNER_TEMP/star-publication.json"
          --result "$RUNNER_TEMP/star-pages-proof.json"
      - name: Record publication on proposal
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          PUBLISHED_PATH="$(jq -r '.paths[0]' "$RUNNER_TEMP/star-publication.json")"
          COMMIT="$(jq -r '.published_commit' "$RUNNER_TEMP/star-publication.json")"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Validated and published \`$PUBLISHED_PATH\` at commit \`$COMMIT\`; completed Pages build and served bytes verified. Proof: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Preserve publication and Pages proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: star-publication-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/star-publication.json
            ${{ runner.temp }}/star-pages-proof.json
          if-no-files-found: warn
