name: Sun Star candidate

on:
  push:
    branches:
      - codex/sun-star-builder-20260915
    paths:
      - "testcode/202609150030/**"
      - ".github/workflows/sun-star-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime data dependency
        run: python -m pip install -r testcode/202609150030/requirements.txt
      - name: Run candidate unit tests
        run: python -m unittest -v testcode/202609150030/test_build_sun.py
      - name: Verify publication manifest is current
        run: |
          python testcode/202609150030/make_publication.py
          git diff --exit-code -- testcode/202609150030/publication.json
      - name: Check out pinned GlobalGrid2050 public sources
        uses: actions/checkout@v5
        with:
          repository: Ventusltd/globalgrid2050
          ref: 35f07f9c0ef6bbdaae3c9f27f5a361118f49624f
          path: globalgrid2050-source
      - name: Run fixed live-source candidate build
        run: >-
          python testcode/202609150030/build_sun.py
          --globalgrid-root globalgrid2050-source
          --globalgrid-commit 35f07f9c0ef6bbdaae3c9f27f5a361118f49624f
          --output candidate-sun
          --as-of 2026-09-13
          --built-utc 2026-09-14T23:30:00Z
      - name: Write CI lane result
        run: >-
          python testcode/202609150030/write_result.py
          --sun candidate-sun
          --output ci-result.json
          --lane github-actions
          --code-commit "$GITHUB_SHA"
      - name: Assert pinned source facts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("ci-result.json").read_text())
          facts = result["facts"]
          assert facts["pv_complete"] is True, facts
          assert facts["pv_intervals"] == 48, facts
          assert facts["solar_projects"] == 3563, facts
          assert facts["with_coordinates"] == 3558, facts
          assert facts["without_coordinates"] == 5, facts
          assert facts["missing_coordinate_repd_refs"] == ["14773", "1613", "1616", "17120", "17260"], facts
          assert facts["press_entries"] > 0, facts
          assert facts["provenance_sources"] == 10, facts
          PY
      - name: Upload CI lane result
        uses: actions/upload-artifact@v4
        with:
          name: sun-star-ci-result
          path: ci-result.json
          if-no-files-found: error
          retention-days: 7
